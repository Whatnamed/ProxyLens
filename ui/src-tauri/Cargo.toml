[package]
name = "proxylens-desktop"
version = "0.7.0"
description = "ProxyLens Windows Desktop Traffic Auditor"
authors = ["ProxyLens Core Team"]
edition = "2021"

[lib]
name = "proxylens_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
tokio = { version = "1", features = ["full"] }
